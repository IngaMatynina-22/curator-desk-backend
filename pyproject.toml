[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curatordesk"
version = "0.1.0"
description = "CuratorDesk — local academic group CRM backend"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "alembic>=1.14.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.2.5",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.setuptools.packages.find]
include = ["app*"]
